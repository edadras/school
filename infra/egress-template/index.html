<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Class recording template</title>
<style>
  html,body{margin:0;height:100%;background:#0f172a;color:#fff;font-family:Vazirmatn,system-ui,sans-serif;overflow:hidden}
  #stage{display:grid;gap:8px;height:100%;padding:8px;box-sizing:border-box;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));grid-auto-rows:1fr}
  #stage.speaker{grid-template-columns:3fr 1fr}
  .tile{position:relative;background:#1e293b;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .tile video{width:100%;height:100%;object-fit:contain}
  .name{position:absolute;bottom:8px;inset-inline-start:10px;background:#0009;padding:2px 8px;border-radius:6px;font-size:14px}
  .rec{position:fixed;top:12px;inset-inline-end:16px;background:#dc2626;border-radius:999px;padding:3px 12px;font-size:13px}
</style>
</head>
<body>
<div class="rec">● ضبط</div>
<div id="stage"></div>
<script src="livekit-client.umd.js"></script>
<script>
/* Self-hosted LiveKit Egress recording template.
 * Contract (LiveKit custom templates): the page is opened with ?url=<ws url>&token=<token>&layout=<layout>;
 * it must join the room as a hidden recorder, render the participants, log "START_RECORDING" once content is on screen
 * and "END_RECORDING" when the class is over. Hosting it ourselves removes the dependency on egress-composite.livekit.io. */
(async () => {
  const dbg = (m) => { try { new Image().src = '/dbg?m=' + encodeURIComponent(String(m).slice(0, 300)); } catch (_) {} };
  window.addEventListener('error', (e) => dbg('jserr ' + e.message));
  const q = new URLSearchParams(location.search);
  dbg('loaded ' + location.search.replace(/token=[^&]+/, 'token=…'));
  const url = q.get('url'), token = q.get('token');
  const stage = document.getElementById('stage');
  if ((q.get('layout') || '').startsWith('speaker')) stage.classList.add('speaker');
  const L = window.LivekitClient;
  const room = new L.Room({ adaptiveStream: false, dynacast: false });
  const tiles = new Map();
  const tileFor = (p) => {
    let t = tiles.get(p.identity);
    if (!t) {
      t = document.createElement('div'); t.className = 'tile';
      const n = document.createElement('div'); n.className = 'name'; n.textContent = p.name || p.identity; t.appendChild(n);
      stage.appendChild(t); tiles.set(p.identity, t);
    }
    return t;
  };
  room.on(L.RoomEvent.TrackSubscribed, (track, pub, p) => {
    const el = track.attach();
    if (track.kind === 'video') { const t = tileFor(p); t.querySelector('video')?.remove(); t.prepend(el); }
    else document.body.appendChild(el);
  });
  room.on(L.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((e) => e.remove()));
  room.on(L.RoomEvent.ParticipantDisconnected, (p) => { tiles.get(p.identity)?.remove(); tiles.delete(p.identity); });
  room.on(L.RoomEvent.Disconnected, (r) => { dbg('disconnected ' + r); console.log('END_RECORDING'); });
  room.on(L.RoomEvent.ConnectionStateChanged, (s) => dbg('state ' + s));
  room.on(L.RoomEvent.MediaDevicesError, (e) => dbg('mediaerr ' + e));
  await room.connect(url, token, { autoSubscribe: true });
  room.remoteParticipants.forEach((p) => tileFor(p));
  console.log('START_RECORDING');
})().catch((e) => { dbg('template error ' + e); console.error('template error', e); });
</script>
</body>
</html>
