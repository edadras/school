# coturn with time-limited credentials (use-auth-secret). The shared secret is passed on the
# command line from $TURN_SECRET, never stored here. Backend config: TURN_URL, TURN_SECRET.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=school
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
min-port=49160
max-port=49200
