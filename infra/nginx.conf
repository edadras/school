# Public entry point: Flutter web (SPA) + Laravel API (php-fpm) + Reverb WebSocket.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  client_max_body_size 55m;               # uploads are capped at 50 MB by the application as well

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # TLS and HSTS terminate at the load balancer / ingress in front of this container.

  root /usr/share/nginx/html;
  index index.html;

  # --- API (php-fpm in the `app` service; its public/ dir is mounted at /var/www/html/public)
  location /api/ {
    root /var/www/html/public;
    try_files $uri /index.php?$query_string;
  }
  location = /index.php {
    root /var/www/html/public;
    fastcgi_pass app:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_read_timeout 60s;
  }

  # --- WebSocket (Laravel Reverb, Pusher protocol)
  location /app/ {
    proxy_pass http://reverb:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # --- Flutter web: hashed assets cache for a year, entry files never
  location ~* \.(?:js|wasm|ttf|otf|png|svg|ico|css|json)$ { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }   # deep links (/student/exams) fall back to the SPA

  location ~ /\.(?!well-known) { deny all; }
}
