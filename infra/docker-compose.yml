# NOT executed in the authoring environment. Secrets come from ../backend/.env and shell env, never from this file.
x-app: &app
  build: {context: .., dockerfile: infra/Dockerfile}
  env_file: ../backend/.env
  depends_on: [mysql, redis]
services:
  app: {<<: *app}
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  queue: {<<: *app, command: php artisan queue:work --tries=3 --timeout=60}
  scheduler: {<<: *app, command: php artisan schedule:work}
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: school
      MYSQL_USER: school
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["mysql:/var/lib/mysql"]
  redis: {image: "redis:7-alpine", volumes: ["redis:/data"]}
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    volumes: ["minio:/data"]
volumes: {mysql: {}, redis: {}, minio: {}}
