# NOT executed in the authoring environment (no Docker daemon): treat as a reviewed starting point.
# Secrets: only from ../backend/.env and the shell environment — nothing secret lives in this file.
# Required shell variables: DB_PASSWORD, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, LIVEKIT_KEYS ("key: secret"), LIVEKIT_API_KEY, LIVEKIT_API_SECRET, TURN_SECRET,
#                           REVERB_HOST, REVERB_KEY (for the web build)
x-app: &app
  build: {context: .., dockerfile: infra/Dockerfile}
  env_file: ../backend/.env
  restart: unless-stopped
  depends_on: [mysql, redis]
  volumes: ["public:/var/www/html/public"]

services:
  app:
    <<: *app
    command: sh -c "php artisan migrate --force && php artisan rbac:sync && php artisan config:cache && php artisan route:cache && php-fpm"
  queue:
    <<: *app
    command: php artisan queue:work redis --queue=default,broadcasts --tries=3 --timeout=60
  scheduler:
    <<: *app
    command: php artisan schedule:work
  reverb:
    <<: *app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args: {REVERB_HOST: "${REVERB_HOST:?set REVERB_HOST}", REVERB_KEY: "${REVERB_KEY:?set REVERB_KEY}"}
    ports: ["8080:80"]
    volumes: ["public:/var/www/html/public:ro"]
    depends_on: [app, reverb]
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: school
      MYSQL_USER: school
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["mysql:/var/lib/mysql"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
    restart: unless-stopped
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
    volumes: ["minio:/data"]
    restart: unless-stopped
  livekit:                                  # the SFU: needs public UDP/TCP (7881 TCP, 50000-50100 UDP) — see docs
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    environment: {LIVEKIT_KEYS: "${LIVEKIT_KEYS:?set LIVEKIT_KEYS}"}
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    ports: ["7880:7880", "7881:7881", "50000-50100:50000-50100/udp"]
    restart: unless-stopped
  clamav:                                   # malware scan for uploads (SCAN_PROVIDER=clamav CLAMAV_HOST=clamav); first start downloads signatures
    image: clamav/clamav:stable
    volumes: ["clamav:/var/lib/clamav"]
    restart: unless-stopped
  egress:                                   # class recording (EGRESS_S3_* must point at the same bucket); needs ≥4 CPU for composite recording
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis: {address: "redis:6379"}
    cap_add: [SYS_ADMIN]
    restart: unless-stopped
  turn:                                     # TURN relay for clients behind strict NAT/firewalls
    image: coturn/coturn:latest
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET}", "--external-ip=${TURN_EXTERNAL_IP:-}"]
    volumes: ["./turnserver.conf:/etc/coturn/turnserver.conf:ro"]
    ports: ["3478:3478/udp", "3478:3478/tcp", "49160-49200:49160-49200/udp"]
    restart: unless-stopped
volumes: {mysql: {}, redis: {}, minio: {}, public: {}, clamav: {}}
