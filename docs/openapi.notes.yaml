paths:
  /auth/login:
    post:
      security: []
      summary: Login (throttled 5/min per login+IP)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - login
              - password
              properties:
                login:
                  type: string
                password:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: '{token,user}'
        '422':
          description: Invalid credentials
        '429':
          description: Throttled
  /auth/me:
    get:
      summary: Current user and memberships
      responses:
        '200':
          description: ok
  /auth/logout:
    post:
      summary: Revoke current token
      responses:
        '200':
          description: ok
  /auth/forgot-password:
    post:
      security: []
      summary: Always 200
      responses:
        '200':
          description: ok
  /auth/reset-password:
    post:
      security: []
      summary: Reset and revoke all tokens
      responses:
        '200':
          description: ok
        '422':
          $ref: '#/components/responses/Invalid'
  /schools/register:
    post:
      security: []
      summary: Organisation sign-up -> pending approval request
      responses:
        '201':
          description: created
        '422':
          $ref: '#/components/responses/Invalid'
  /schools/my-request:
    get:
      summary: Status of own registration
      responses:
        '200':
          description: ok
  /schools/my-request/resubmit:
    post:
      summary: Resubmit after needs_changes
      responses:
        '200':
          description: ok
  /platform/approval-requests:
    get:
      summary: List (filter status) — super_admin
      responses:
        '200':
          description: paginated
  /platform/approval-requests/{id}/decision:
    post:
      summary: decision=approve|reject|needs_changes (note required unless approve)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
        '422':
          description: Already decided / invalid
  /platform/schools:
    get:
      summary: List schools (q
      status): null
      responses:
        '200':
          description: paginated
  /platform/schools/{id}/suspend:
    post:
      summary: Suspend with reason
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
  /platform/schools/{id}/reactivate:
    post:
      summary: Reactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
  /platform/schools/{id}/subscription:
    patch:
      summary: Plan limits
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
  /academics/{resource}:
    get:
      summary: List. resource ∈ academic-years|grades|subjects|sections|students|calendar-events. perm academics.view. Params q,status,grade_id,academic_year_id,per_page
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: resource
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: paginated
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create (academics.manage; students limited by subscription)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: resource
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: created
        '422':
          $ref: '#/components/responses/Invalid'
  /academics/{resource}/{id}:
    get:
      summary: Show
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
        '404':
          description: Missing or other school
    patch:
      summary: Update
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
    delete:
      summary: Delete; 409 if dependents exist; years/students are archived not deleted
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: deleted
        '409':
          description: Blocked
  /teachers:
    get:
      summary: List
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: ok
    post:
      summary: Create teacher account + membership (people.manage)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '201':
          description: created
  /teacher-assignments:
    get:
      summary: List
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: ok
    post:
      summary: Assign teacher to section+subject (one teacher per pair; grade must match)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '201':
          description: created
        '422':
          $ref: '#/components/responses/Invalid'
  /enrollments:
    get:
      summary: List
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: ok
    post:
      summary: Enrol or transfer (idempotent; capacity enforced)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '201':
          description: enrolled
        '200':
          description: already/transferred
        '422':
          description: Capacity full
  /students/{id}/guardians:
    post:
      summary: Create/link guardian (approved by staff)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: linked
  /students/{id}/guardians/{guardianId}:
    delete:
      summary: Revoke link
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: guardianId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: revoked
  /me/children:
    get:
      summary: Guardian's approved children only
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: ok
  /timetables:
    get:
      summary: List (schedule.view)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: ok
    post:
      summary: Create draft with periods (kind lesson|break|prep; HH:MM; ordered, non-overlapping)
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '201':
          description: created
        '422':
          $ref: '#/components/responses/Invalid'
  /timetables/{id}:
    get:
      summary: Show with periods and entries
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
  /timetables/{id}/check:
    post:
      summary: Dry-run conflicts -> {ok, conflicts[{code,message}]}
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
  /timetables/{id}/entries:
    post:
      summary: Add entry; 422 on section_busy|teacher_busy|not_assigned|teacher_mismatch|non_working_day|bad_period
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: created
        '422':
          $ref: '#/components/responses/Invalid'
  /timetables/{id}/entries/{entryId}:
    delete:
      summary: Remove entry
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: entryId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: removed
  /timetables/{id}/activate:
    post:
      summary: Activate (archives previous
      notifies affected users once): null
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: ok
  /substitutions:
    post:
      summary: Substitute or cancel one occurrence on a date
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '201':
          description: ok
        '422':
          $ref: '#/components/responses/Invalid'
  /me/schedule:
    get:
      summary: Own weekly schedule (teacher or student) + server_time
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      responses:
        '200':
          description: ok
  /me/notifications:
    get:
      summary: Incremental feed; pass since_id after reconnect
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: since_id
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: '{data,server_time}'
  /me/notifications/{id}/read:
    post:
      summary: Mark read
      parameters:
      - $ref: '#/components/parameters/SchoolId'
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: ok
