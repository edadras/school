openapi: 3.0.3
info:
  title: School Platform API
  version: 1.0.0
  description: 'Generated from the Laravel route table (scripts/gen_openapi.py). Persian messages in `message`. Multi-tenant: send `X-School-Id`
    when the user belongs to several schools; it is a selector only and is verified against active memberships.'
servers:
- url: /api/v1
security:
- bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    SchoolId:
      name: X-School-Id
      in: header
      required: false
      schema:
        type: integer
      description: Selector only; must match an active membership, else 403 school_not_resolved.
  responses:
    Forbidden:
      description: Not permitted / school not resolved
    Invalid:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
paths:
  /academics/{resource}:
    get:
      tags:
      - academics
      summary: List. resource ∈ academic-years|grades|subjects|sections|students|calendar-events. perm academics.view. Params q,status,grade_id,academic_year_id,per_page
      responses:
        '200':
          description: paginated
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Permission (any of): academics.view'
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SchoolId'
    post:
      tags:
      - academics
      summary: Create (academics.manage; students limited by subscription)
      responses:
        '201':
          description: created
        '422':
          $ref: '#/components/responses/Invalid'
      description: 'Permission (any of): academics.manage'
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SchoolId'
  /academics/{resource}/{id}:
    get:
      tags:
      - academics
      summary: Show
      responses:
        '200':
          description: ok
        '404':
          description: Missing or other school
      description: 'Permission (any of): academics.view'
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SchoolId'
    patch:
      tags:
      - academics
      summary: Update
      responses:
        '200':
          description: ok
      description: 'Permission (any of): academics.manage'
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SchoolId'
    delete:
      tags:
      - academics
      summary: Delete; 409 if dependents exist; years/students are archived not deleted
      responses:
        '204':
          description: deleted
        '409':
          description: Blocked
      description: 'Permission (any of): academics.manage'
      parameters:
      - name: resource
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/SchoolId'
  /ai/admin/summary:
    post:
      tags:
      - ai
      summary: AiController@adminSummary
      responses:
        '200':
          description: OK
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden / school not resolved
        '422':
          $ref: '#/components/responses/Invalid'
      description: 'Permission (any of): ai.use_admin

